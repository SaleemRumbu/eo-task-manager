<!DOCTYPE html>
<html lang="en">
<head>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("ed1-theme")||"light"}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Executive Task Manager</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
<div id="app"></div>
<script>window.ROOT = "../../";</script>
<script src="../../config.js"></script>
<script src="../../auth.js"></script>
<script>
const IC = {
  total:'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  clock:'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  alert:'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.3 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.3a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>',
  x:'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
};
let CH={}, DATA={}, ME=null, PERIOD="all";

(async () => {
  ME = await requireAuth({ role:"superadmin" });
  if(!ME) return;
  renderShell(ME, { active:"Dashboard", title:"Dashboard", note:"Overview & analytics" });
  buildFrame();
  await load();
})();

function buildFrame(){
  const hour=new Date().getHours();
  const greet=hour<12?"Good morning":hour<17?"Good afternoon":"Good evening";
  const firstName=(ME.full_name||"").split(" ")[0];
  document.getElementById("content").innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap">
      <div>
        <div style="font-size:21px;font-weight:800;color:var(--ink)">${greet}, ${escapeHtml(firstName)} 👋</div>
        <div class="muted" style="font-size:13px">${new Date().toLocaleDateString("en-GB",{weekday:"long",day:"2-digit",month:"short",year:"numeric"})}</div>
      </div>
      <div class="seg" id="periodSeg" style="margin:0">
        ${[["today","Today"],["week","This week"],["month","This month"],["30d","Last 30 days"],["all","All time"],["custom","Custom…"]]
          .map(([v,l])=>`<button class="seg-btn${v==="all"?" active":""}" data-v="${v}" onclick="setPeriod(this)">${l}</button>`).join("")}
      </div>
    </div>
    <div id="customRow" style="display:none;margin:-6px 0 6px" class="row-gap">
      <div class="field"><label>From</label><input type="date" id="p_from" onchange="load()"></div>
      <div class="field"><label>To</label><input type="date" id="p_to" onchange="load()"></div>
    </div>
    <div class="row-gap" style="margin:0 0 14px">
      <div class="field"><label>Filter by unit</label><select id="p_unit" onchange="load()"><option value="all">All units</option></select></div>
    </div>
    <div id="dash"></div>`;
}

function setPeriod(btn){
  PERIOD=btn.dataset.v;
  [...document.querySelectorAll("#periodSeg .seg-btn")].forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("customRow").style.display = PERIOD==="custom" ? "flex" : "none";
  load();
}

async function populateUnitFilter(units){
  const sel=document.getElementById("p_unit");
  if(!sel) return;
  const cur=sel.value;
  sel.innerHTML='<option value="all">All units</option>'+(units||[]).map(u=>`<option value="${u.id}">${escapeHtml(u.name)}</option>`).join("");
  if(cur) sel.value=cur;
}

function periodRange(){
  const t=new Date(); t.setHours(0,0,0,0);
  const iso=d=>d.toISOString().slice(0,10);
  if(PERIOD==="today"){ return { from:iso(t), to:iso(t) }; }
  if(PERIOD==="week"){ const d=new Date(t); d.setDate(d.getDate()-((d.getDay()+6)%7)); return { from:iso(d), to:iso(t) }; }
  if(PERIOD==="month"){ const d=new Date(t.getFullYear(),t.getMonth(),1); return { from:iso(d), to:iso(t) }; }
  if(PERIOD==="30d"){ const d=new Date(t); d.setDate(d.getDate()-29); return { from:iso(d), to:iso(t) }; }
  if(PERIOD==="custom"){ return { from:document.getElementById("p_from").value||null, to:document.getElementById("p_to").value||null }; }
  return { from:null, to:null };
}

async function load(){
  const dash=document.getElementById("dash"); dash.innerHTML=`<div class="empty">Loading…</div>`;
  const { from, to } = periodRange();
  const unitSel=document.getElementById("p_unit");
  const unitFilter = unitSel ? unitSel.value : "all";

  let tq=sb.from("tasks").select("unit_id, status, due_date, created_at").is("archived_at",null);
  if(from) tq=tq.gte("created_at",from);
  if(to)   tq=tq.lte("created_at", to + "T23:59:59");
  if(unitFilter!=="all") tq=tq.eq("unit_id",unitFilter);

  let pq=sb.from("tasks").select("id, title, status, due_date, created_at").is("unit_id",null).is("archived_at",null).eq("owner_id",ME.id);
  if(from) pq=pq.gte("created_at",from);
  if(to)   pq=pq.lte("created_at", to + "T23:59:59");

  const [{ data: units }, { data: tasks }, { data: acts }, { data: personal }] = await Promise.all([
    sb.from("units").select("id, name").is("archived_at",null).order("name"),
    tq,
    sb.from("activity_log").select("action, created_at, actor:profiles(full_name)").order("created_at",{ascending:false}).limit(8),
    pq.order("due_date",{ascending:true,nullsFirst:false}),
  ]);
  await populateUnitFilter(units);
  const all=tasks||[];
  const overdue=t=>t.due_date && t.status!=="approved" && t.due_date<todayStr();
  const cnt=s=>all.filter(t=>t.status===s).length;
  const kpi={ total:all.length, inprog:cnt("in_progress"), pending:cnt("pending_review"), approved:cnt("approved"), rejected:cnt("rejected"), due:all.filter(overdue).length };
  DATA={ units:units||[], all };

  const rangeLabel = (from||to) ? `${from?fmtDate(from):"start"} → ${to?fmtDate(to):"today"}` : "All time";
  const card=(href,cls,ic,num,label)=>`<a class="kpi ${cls}" href="${href}"><div class="kpi-ico">${IC[ic]}</div><div class="kpi-num">${num}</div><div class="kpi-label">${label}</div></a>`;
  const feed=(acts||[]).length?(acts||[]).map(a=>`<div class="feed-item"><div class="feed-dot">${escapeHtml(initials(a.actor?a.actor.full_name:"?"))}</div><div class="feed-body"><div class="feed-text">${escapeHtml(a.action)}</div><div class="feed-meta">${escapeHtml(a.actor?a.actor.full_name:"Someone")} • ${timeAgo(a.created_at)}</div></div></div>`).join(""):`<div class="muted">No activity yet.</div>`;

  dash.innerHTML=`
    <div class="muted" style="font-size:12.5px;margin:-8px 0 10px">Showing: <strong>${escapeHtml(rangeLabel)}</strong></div>
    ${kpi.due>0?`<a href="tasks.html?view=overdue" class="card" style="display:flex;align-items:center;gap:12px;margin-bottom:16px;border-color:var(--red);color:inherit"><span style="font-size:20px">⚠️</span><div><strong style="color:var(--red)">${kpi.due} task${kpi.due===1?" is":"s are"} overdue.</strong> <span class="muted">Click to review them now.</span></div></a>`:""}
    <div class="grid grid-5">
      ${card("tasks.html","k-navy","total",kpi.total,"Total tasks")}
      ${card("tasks.html?status=pending_review","k-amber","clock",kpi.pending,"Pending review")}
      ${card("tasks.html?view=overdue","k-red","alert",kpi.due,"Due (overdue)")}
      ${card("tasks.html?status=approved","k-green","check",kpi.approved,"Approved")}
      ${card("tasks.html?status=rejected","k-red","x",kpi.rejected,"Rejected")}
    </div>
    <div class="grid grid-3" style="margin-top:16px">
      <div class="card"><div class="section-head"><h2>Status split</h2></div><div class="chart-box sm"><canvas id="c_status"></canvas></div></div>
      <div class="card"><div class="section-head"><h2>Tasks by unit</h2></div><div class="chart-box sm"><canvas id="c_unit"></canvas></div></div>
      <div class="card"><div class="section-head"><h2>New tasks (8 weeks)</h2></div><div class="chart-box sm"><canvas id="c_trend"></canvas></div></div>
    </div>
    <div class="grid grid-3" style="margin-top:16px">
      <div class="card"><div class="section-head"><h2>My personal tasks</h2><a class="btn btn-sm" href="tasks.html?scope=personal">Manage</a></div>
        <div class="row-gap" style="margin-bottom:12px">
          <span class="count-pill">${(personal||[]).length} total</span>
          <span class="count-pill" style="background:color-mix(in srgb,var(--amber) 15%,transparent);color:var(--amber)">${(personal||[]).filter(t=>t.status!=="approved").length} open</span>
          <span class="count-pill" style="background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)">${(personal||[]).filter(t=>t.status==="approved").length} done</span>
        </div>
        <div class="feed">${(personal||[]).filter(t=>t.status!=="approved").slice(0,5).map(t=>{const di=daysInfo(t.due_date,t.status);return `<div class="feed-item"><div class="feed-body"><div class="feed-text">${escapeHtml(t.title)}</div><div class="feed-meta"><span class="due ${di.cls}">${di.text}</span></div></div></div>`;}).join("")||`<div class="muted">No open personal tasks.</div>`}</div></div>
      <div class="card"><div class="section-head"><h2>By unit</h2><a class="btn btn-sm" href="tasks.html">Open tasks</a></div>
        <div class="table-wrap" style="box-shadow:none"><table><thead><tr><th>Unit</th><th>Total</th><th>Pending</th><th>Overdue</th><th>Approved</th><th>Rejected</th></tr></thead><tbody id="unitRows"></tbody></table></div></div>
      <div class="card"><div class="section-head"><h2>Recent activity</h2><a class="btn btn-sm" href="activity.html">View all</a></div><div class="feed">${feed}</div></div>
    </div>`;

  const tally=list=>({total:list.length,pending:list.filter(t=>t.status==="pending_review").length,due:list.filter(overdue).length,approved:list.filter(t=>t.status==="approved").length,rejected:list.filter(t=>t.status==="rejected").length});
  document.getElementById("unitRows").innerHTML=(units||[]).map(u=>{const t=tally(all.filter(x=>x.unit_id===u.id));return `<tr><td><strong>${escapeHtml(u.name)}</strong></td><td>${t.total}</td><td>${t.pending}</td><td>${t.due?`<span class="badge badge-rejected badge-flat">${t.due}</span>`:0}</td><td>${t.approved}</td><td>${t.rejected}</td></tr>`;}).join("")||`<tr><td colspan="6" class="empty">No units yet.</td></tr>`;

  drawCharts(kpi);
  new MutationObserver(()=>drawCharts(kpi)).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
}

function themeColors(){ const cs=getComputedStyle(document.body); return { text:cs.getPropertyValue("--muted").trim()||"#667085", grid:cs.getPropertyValue("--line").trim()||"#e8ecf3", accent:cs.getPropertyValue("--accent").trim()||"#2E75B6", navy:cs.getPropertyValue("--navy").trim()||"#1F3864" }; }

function drawCharts(kpi){
  Object.values(CH).forEach(c=>{try{c.destroy();}catch(e){}}); CH={};
  const col=themeColors(); const AMBER="#d0850f",GREEN="#15803d",RED="#c0392b";
  Chart.defaults.font.family=getComputedStyle(document.body).fontFamily; Chart.defaults.color=col.text;
  CH.status=new Chart(document.getElementById("c_status"),{type:"doughnut",data:{labels:["In progress","Pending review","Approved","Rejected"],datasets:[{data:[kpi.inprog,kpi.pending,kpi.approved,kpi.rejected],backgroundColor:[col.accent,AMBER,GREEN,RED],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:"64%",plugins:{legend:{position:"bottom",labels:{boxWidth:9,boxHeight:9,usePointStyle:true,padding:14}}}}});
  const labels=DATA.units.map(u=>u.name), totals=DATA.units.map(u=>DATA.all.filter(x=>x.unit_id===u.id).length);
  CH.unit=new Chart(document.getElementById("c_unit"),{type:"bar",data:{labels,datasets:[{data:totals,backgroundColor:col.navy,borderRadius:7,maxBarThickness:32}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0},grid:{color:col.grid}},x:{grid:{display:false}}}}});
  const now=new Date(),weeks=[]; for(let i=7;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i*7);weeks.push(d);}
  const wk=d=>{const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toISOString().slice(0,10);};
  const bucket={}; weeks.forEach(w=>bucket[wk(w)]=0); DATA.all.forEach(t=>{const k=wk(t.created_at);if(k in bucket)bucket[k]++;});
  CH.trend=new Chart(document.getElementById("c_trend"),{type:"line",data:{labels:Object.keys(bucket).map(k=>fmtDate(k).replace(/ \d{4}$/,"")),datasets:[{data:Object.values(bucket),borderColor:col.accent,backgroundColor:"rgba(46,117,182,.14)",fill:true,tension:.35,pointRadius:3,pointBackgroundColor:col.accent}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0},grid:{color:col.grid}},x:{grid:{display:false}}}}});
}
</script>
</body>
</html>
