<!DOCTYPE html>
<html lang="en">
<head>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("ed1-theme")||"light"}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Executive Task Manager</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="auth-wrap"><div class="auth-card"><p class="auth-sub" id="msg">Loading…</p></div></div>
<script src="config.js"></script>
<script>
(async () => {
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ window.location.href = "login.html"; return; }
  const { data:p } = await sb.from("profiles").select("role, must_change_password").eq("id", session.user.id).single();
  if(!p){ await sb.auth.signOut(); window.location.href="login.html"; return; }
  if(p.must_change_password){ window.location.href="change-password.html"; return; }
  window.location.href = p.role==="superadmin" ? "modules/superadmin/dashboard.html" : "modules/admin/dashboard.html";
})();
</script>
</body>
</html>
